<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bookmarks · Eeps Site</title>
<style>
  :root{
    --ink:#f4f1e8;--sand:#e8dcc0;--brass:#e6a23c;--brass-bright:#ffc861;
    --sea:#081018;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--sans);background:var(--sea);
    display:flex;flex-direction:column;min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(115% 85% at 50% 32%,rgba(4,10,16,.12) 0%,rgba(4,10,16,.42) 55%,rgba(4,10,16,.80) 100%),
      linear-gradient(to bottom,rgba(4,10,16,.42),rgba(4,10,16,.06) 40%,rgba(4,10,16,.76));
    z-index:0;pointer-events:none;
  }
  main{position:relative;z-index:1;flex:1;padding:min(7vh,52px) 20px 32px}
  .hero{text-align:center;max-width:880px;width:100%;margin:0 auto}
  .flag{width:58px;height:58px;border-radius:12px;box-shadow:0 8px 26px rgba(0,0,0,.55);display:block;margin:0 auto 18px}
  .kicker{margin:0 0 14px;font-family:var(--sans);font-size:.72rem;letter-spacing:.34em;text-transform:uppercase;color:var(--sand);opacity:.82}
  h1{margin:0;font-family:var(--serif);font-weight:700;font-size:clamp(2.35rem,7.4vw,4.2rem);line-height:1.02;letter-spacing:.01em;text-shadow:0 2px 4px rgba(0,0,0,.7),0 10px 40px rgba(0,0,0,.85)}
  h1 .the{display:block;font-size:.32em;letter-spacing:.30em;text-transform:uppercase;opacity:.78;margin-bottom:.55em;font-family:var(--sans);font-weight:600;text-indent:.30em}
  .lede{margin:1.05rem auto 0;max-width:34rem;font-size:clamp(.95rem,2.4vw,1.05rem);line-height:1.66;color:#efece2;text-shadow:0 1px 3px rgba(0,0,0,.9),0 6px 26px rgba(0,0,0,.75)}
  .toolbar{display:flex;flex-wrap:wrap;gap:.6rem;justify-content:center;margin:1.4rem 0 1.2rem}
  .toolbar button,.toolbar input{
    font:inherit;font-size:.82rem;font-weight:700;padding:.55em .9em;border-radius:999px;
    border:1px solid rgba(255,200,97,.55);color:#1a1206;background:linear-gradient(180deg,rgba(230,162,60,.92),rgba(186,116,22,.92));
    cursor:pointer;
  }
  .toolbar input{background:rgba(4,10,16,.72);color:var(--ink);border:1px solid rgba(232,220,192,.28);min-width:260px}
  .toolbar input::placeholder{color:#a9a291}
  .grid{display:grid;grid-template-columns:1fr;gap:10px;max-width:900px;margin:0 auto;width:100%}
  .card{
    display:flex;align-items:flex-start;gap:.7rem;padding:.75rem .9rem;border-radius:12px;
    background:rgba(10,18,26,.66);border:1px solid rgba(232,220,192,.18);backdrop-filter:blur(6px);
    cursor:grab;transition:transform .12s ease,border-color .12s ease;
  }
  .card.dragging{opacity:.6;transform:scale(.98)}
  .card:hover{border-color:rgba(255,200,97,.45)}
  .fav{
    width:28px;height:28px;border-radius:6px;flex:none;background:rgba(4,10,16,.7);
    border:1px solid rgba(232,220,192,.18);display:grid;place-items:center;overflow:hidden;
  }
  .fav img{width:20px;height:20px;object-fit:contain}
  .fav .fallback{font-size:.7rem;font-weight:800;color:var(--brass-bright)}
  .body{min-width:0;flex:1}
  .body a{color:var(--sand);text-decoration:none;font-weight:700;font-size:.92rem;line-height:1.3;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .body a:hover{color:var(--brass-bright)}
  .desc{font-size:.78rem;color:#a9a291;line-height:1.4;margin-top:.2rem;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .del{
    flex:none;font:inherit;font-size:.72rem;font-weight:800;padding:.35em .55em;border-radius:999px;
    border:1px solid rgba(224,90,79,.45);color:#ffc9c1;background:rgba(224,90,79,.12);cursor:pointer;
  }
  .sort-btn{
    flex:none;font:inherit;font-size:.72rem;font-weight:800;padding:.35em .55em;border-radius:999px;
    border:1px solid rgba(232,220,192,.28);color:var(--sand);background:rgba(232,220,192,.08);cursor:pointer;
    line-height:1;
  }
  .sort-btn:hover{background:rgba(230,162,60,.18);border-color:rgba(255,200,97,.45)}
  .sort-btn:disabled{opacity:.35;cursor:not-allowed}
  .del:hover{background:rgba(224,90,79,.22)}
  .empty{text-align:center;color:#8f8a7c;font-size:.92rem;margin-top:2rem}
  .back{margin:1.3rem 0 0;font-size:.82rem;text-align:center}
  .back a{color:var(--sand)}.back a:hover{color:var(--brass-bright)}
  footer{position:relative;z-index:1;padding:20px 20px 24px;text-align:center;border-top:1px solid rgba(232,220,192,.14);background:linear-gradient(to bottom,rgba(4,10,16,.55),rgba(4,10,16,.92))}
  footer p{margin:0 auto;max-width:44rem;font-size:.74rem;line-height:1.7;color:#a9a291}
  footer a{color:var(--sand)}
  .modal{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;z-index:100;
  }
  .modal.open{display:flex}
  .modal-bg{position:absolute;inset:0;background:rgba(4,10,16,.7)}
  .modal-box{
    position:relative;width:min(480px,100%);background:rgba(10,18,26,.92);border:1px solid rgba(232,220,192,.22);
    border-radius:14px;padding:1.1rem 1.2rem;backdrop-filter:blur(8px);
  }
  .modal-box h2{margin:0 0 .8rem;font-family:var(--serif);font-size:1.3rem}
  .modal-box label{display:block;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);margin:.6rem 0 .3rem}
  .modal-box input,.modal-box textarea{
    width:100%;font:inherit;font-size:.9rem;padding:.55em .7em;border-radius:10px;
    border:1px solid rgba(232,220,192,.28);background:rgba(4,10,16,.72);color:var(--ink);
  }
  .modal-box textarea{min-height:5.5rem;resize:vertical}
  .modal-box button{font:inherit;font-size:.86rem;font-weight:700;padding:.55em .9em;border-radius:999px;border:1px solid rgba(255,200,97,.55);color:#1a1206;background:linear-gradient(180deg,rgba(230,162,60,.92),rgba(186,116,22,.92));cursor:pointer;margin-top:.7rem}
  .modal-box .cancel{margin-left:.5rem;background:rgba(232,220,192,.1);color:var(--sand);border:1px solid rgba(232,220,192,.22)}
</style>
</head>
<body>
<main>
  <section class="hero">
    <img class="flag" src="/static/piracy/pirate-flag.svg" width="58" height="58" alt="Solovlag">
    <p class="kicker">Eeps Site · bookmarks</p>
    <h1><span class="the">Kaartenkast</span>Bookmarks</h1>
    <p class="lede">De belangrijkste links voor dit project, verzameld op één plek. Sleep om te sorteren, klik op de knop om te bewerken of te verwijderen.</p>
    <div class="toolbar">
      <input type="text" id="url" placeholder="https://voorbeeld.nl" aria-label="URL">
      <input type="text" id="name" placeholder="Naam" aria-label="Naam">
      <button id="addBtn">+ Toevoegen</button>
    </div>
    <div class="grid" id="grid"></div>
    <p class="back"><a href="crew.html">← Terug naar de crew</a></p>
  </section>
</main>
<footer>
  <p>© 2026 Eep · bookmarks lokaal beheerd · max 30</p>
</footer>

<div class="modal" id="editModal">
  <div class="modal-bg" id="modalBg"></div>
  <div class="modal-box">
    <h2>Bewerk bookmark</h2>
    <label for="editName">Naam</label>
    <input type="text" id="editName">
    <label for="editUrl">URL</label>
    <input type="text" id="editUrl">
    <label for="editDesc">Omschrijving</label>
    <textarea id="editDesc"></textarea>
    <button id="saveEdit">Opslaan</button>
    <button class="cancel" id="cancelEdit">Annuleren</button>
  </div>
</div>

<script>
(function(){
  var KEY = 'eeps.bookmarks.v1';
  var DEFAULT = [
    {name:'Online versie Wildpluk',url:'https://8080-agqx224k5zkc5mqncvy5shafsi.instabox.tech/',desc:'De live wildpluk-site langs de Waddenkust.',cat:'agents'},
    {name:'THE EPI CENTER — DASHBOARD',url:'http://192.168.43.51:8095/',desc:'Lokaal dashboard van het Epi-center.',cat:'agents'},
    {name:'Alibaby Qwen Chat',url:'http://127.0.0.1:8080/#/chat/8da25fac-6205-48e5-94ef-bfa9def86fdc',desc:'Lokale Qwen-chat interface.',cat:'agents'},
    {name:'Duck.ai',url:'https://duck.ai/?origin=funnel_home_website',desc:'Private AI chat van DuckDuckGo.',cat:'agents'},
    {name:'Freebuff CLI',url:'https://freebuff.com/cli',desc:'Free coding in your terminal.',cat:'agents'},
    {name:'Proton Mail',url:'https://mail.proton.me/u/3/inbox#category=primary',desc:'Postvak IN van JandeGein@proton.me.',cat:'agents'},
    {name:'GitHub repo',url:'https://github.com/evtriest/evtriest.github.io',desc:'Broncode van de landingspagina en crew-pagina.',cat:'project'},
    {name:'Wildpluk GitHub Pages',url:'https://evtriest.github.io',desc:'Gedeployde versie van de site.',cat:'project'},
    {name:'xeno-canto',url:'https://xeno-canto.org/explore?query=since%3A31&dir=0&order=cnt&pg=171',desc:'Vogelgeluidenbank — handig voor de vogelgids.',cat:'project'},
    {name:'Radio Garden',url:'https://radio.garden/visit/bourges/g26HZxDU',desc:'Luister naar radio over de hele wereld.',cat:'project'},
    {name:'DuckDuckGo',url:'https://duckduckgo.com/',desc:'Zoekmachine zonder tracking.',cat:'tools'},
    {name:'YouTube',url:'https://www.youtube.com/',desc:'Video-platform.',cat:'tools'}
  ];

  function load(){
    try{ var raw=localStorage.getItem(KEY); if(raw){ return JSON.parse(raw); } }catch(e){}
    return DEFAULT.slice();
  }
  function save(list){ localStorage.setItem(KEY, JSON.stringify(list)); }

  function faviconUrl(url){
    try{
      var u=new URL(url); return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(u.hostname)+'&sz=64';
    }catch(e){ return ''; }
  }
  function fallbackLetter(name){ return (name||'?').charAt(0).toUpperCase(); }

  var list = load();
  var editIdx = -1;
  var grid = document.getElementById('grid');
  var modal = document.getElementById('editModal');

  function render(){
    grid.innerHTML='';
    if(!list.length){ grid.innerHTML='<p class="empty">Nog geen bookmarks. Voeg er boven een toe.</p>'; return; }
    list.forEach(function(b,i){
      var card=document.createElement('div');
      card.className='card'; card.draggable=true; card.dataset.idx=i;
      var fav=document.createElement('div'); fav.className='fav';
      var fu=faviconUrl(b.url);
      if(fu){
        var img=document.createElement('img'); img.src=fu; img.alt=''; img.loading='lazy';
        img.onerror=function(){ fav.innerHTML='<span class="fallback">'+fallbackLetter(b.name)+'</span>'; };
        fav.appendChild(img);
      }else{
        fav.innerHTML='<span class="fallback">'+fallbackLetter(b.name)+'</span>';
      }
      var body=document.createElement('div'); body.className='body';
      var a=document.createElement('a'); a.href=b.url; a.target='_blank'; a.rel='noopener'; a.textContent=b.name||b.url;
      body.appendChild(a);
      if(b.desc){
        var d=document.createElement('div'); d.className='desc'; d.textContent=b.desc; body.appendChild(d);
      }
      var up=document.createElement('button'); up.className='sort-btn'; up.textContent='↑';
      up.disabled = i === 0;
      up.onclick=function(){ if(i>0){ var item=list.splice(i,1)[0]; list.splice(i-1,0,item); save(list); render(); } };
      var down=document.createElement('button'); down.className='sort-btn'; down.textContent='↓';
      down.disabled = i === list.length-1;
      down.onclick=function(){ if(i<list.length-1){ var item=list.splice(i,1)[0]; list.splice(i+1,0,item); save(list); render(); } };
      var edit=document.createElement('button'); edit.className='del'; edit.textContent='Bewerk'; edit.style.marginRight='.4rem'; edit.style.borderColor='rgba(255,200,97,.45)'; edit.style.color='#ffd88a';
      edit.onclick=function(){ openEdit(i); };
      var del=document.createElement('button'); del.className='del'; del.textContent='Verwijder';
      del.onclick=function(){ list.splice(i,1); if(list.length>30) list=list.slice(0,30); save(list); render(); };
      card.appendChild(fav); card.appendChild(body); card.appendChild(up); card.appendChild(down); card.appendChild(edit); card.appendChild(del);

      card.addEventListener('dragstart',function(e){ e.dataTransfer.setData('text/plain',i); card.classList.add('dragging'); });
      card.addEventListener('dragend',function(){ card.classList.remove('dragging'); });
      card.addEventListener('dragover',function(e){ e.preventDefault(); });
      card.addEventListener('drop',function(e){
        e.preventDefault(); var from=parseInt(e.dataTransfer.getData('text/plain'),10); var to=i;
        if(from===to) return; var item=list.splice(from,1)[0]; list.splice(to,0,item); save(list); render();
      });

      grid.appendChild(card);
    });
  }

  function openEdit(i){
    editIdx=i;
    document.getElementById('editName').value=list[i].name||'';
    document.getElementById('editUrl').value=list[i].url||'';
    document.getElementById('editDesc').value=list[i].desc||'';
    modal.classList.add('open');
  }
  document.getElementById('saveEdit').onclick=function(){
    if(editIdx<0) return;
    list[editIdx].name=document.getElementById('editName').value.trim()||list[editIdx].name;
    list[editIdx].url=document.getElementById('editUrl').value.trim()||list[editIdx].url;
    list[editIdx].desc=document.getElementById('editDesc').value.trim();
    save(list); modal.classList.remove('open'); editIdx=-1; render();
  };
  document.getElementById('cancelEdit').onclick=function(){ modal.classList.remove('open'); editIdx=-1; };
  document.getElementById('modalBg').onclick=function(){ modal.classList.remove('open'); editIdx=-1; };

  document.getElementById('addBtn').onclick=function(){
    var name=document.getElementById('name').value.trim();
    var url=document.getElementById('url').value.trim();
    if(!url){ alert('URL is verplicht.'); return; }
    if(list.length>=30){ alert('Maximum 30 bookmarks.'); return; }
    list.unshift({name:name||url,url:url,desc:''});
    document.getElementById('name').value=''; document.getElementById('url').value='';
    save(list); render();
  };

  render();
})();
</script>
</body>
</html>
