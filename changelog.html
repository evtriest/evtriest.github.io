<style>
  :root{
    --bg:#0a0e12; --sea:#0d1a22; --panel:rgba(8,16,22,.82);
    --sand:#e8dcc0; --brass:#c8a45c; --brass-bright:#e8c987;
    --ink:#efe7d6; --ink-2:#c9c0ad; --muted:#9a927f; --faint:#7c7568;

  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;padding:1.6rem 18px 4rem;
    background:linear-gradient(180deg,#06090d 0%,var(--bg) 40%,#0b1218 100%);

    font-size:15px;line-height:1.72;
  }
  .topbar{display:flex;gap:.55rem;flex-wrap:wrap;margin:0 auto 1.6rem;max-width:820px}
  .topbar a{
    display:inline-flex;align-items:center;gap:.35rem;padding:.34rem .78rem;border-radius:999px;

  }
  .topbar a:hover,.topbar a:focus-visible{background:rgba(200,164,92,.14);border-color:var(--brass)}
  /* paginanavigatie bovenaan */
  .pagebar{position:relative;z-index:2;padding:14px 68px 0 16px;display:flex;justify-content:center}
  .pagebar-inner{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:880px}
  .pagebar a{
    font-size:.72rem;letter-spacing:.05em;text-decoration:none;padding:.38em .82em;border-radius:999px;
    color:var(--ink-2);border:1px solid color-mix(in srgb,var(--sand) 22%,transparent);
    background:color-mix(in srgb,var(--sand) 6%,transparent);
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .pagebar a:hover{color:var(--brass-bright);border-color:color-mix(in srgb,var(--brass-bright) 65%,transparent);background:color-mix(in srgb,var(--brass) 14%,transparent)}
  .pagebar a:focus-visible{outline:2px solid var(--brass-bright);outline-offset:2px}
  main{max-width:820px;margin:0 auto}
  h1{font-size:1.5rem;color:var(--ink);letter-spacing:.01em;margin-bottom:.25rem}
  .sub{font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-bottom:1.4rem}
  #doc{
    padding:1.3rem 1.4rem;border-radius:14px;border:1px solid rgba(232,220,192,.14);
    background:var(--panel);box-shadow:0 18px 40px rgba(0,0,0,.35);
  }
  #doc h1{font-size:1.32rem;margin:0 0 1rem;padding-bottom:.6rem;border-bottom:1px solid rgba(232,220,192,.16)}
  #doc h2{
    font-size:1.02rem;color:var(--brass-bright);margin:1.7rem 0 .6rem;padding-bottom:.35rem;
    border-bottom:1px solid rgba(232,220,192,.1);
  }
  #doc h3,#doc h4{font-size:.92rem;color:var(--sand);margin:1.2rem 0 .45rem}
  #doc p{margin:.55rem 0}
  #doc ul,#doc ol{margin:.5rem 0 .8rem;padding-left:1.25rem}
  #doc li{margin:.3rem 0}
  #doc li::marker{color:var(--brass)}
  #doc strong{color:var(--ink)}
  #doc em{color:var(--sand)}
  #doc a{color:var(--brass-bright);text-decoration:none;border-bottom:1px solid rgba(232,201,135,.35)}
  #doc a:hover{border-bottom-color:var(--brass-bright)}
  #doc code{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.86em;
    padding:.08em .34em;border-radius:5px;color:var(--brass-bright);
    background:rgba(200,164,92,.12);border:1px solid rgba(200,164,92,.18);
  }
  #doc pre{
    margin:.7rem 0;padding:.7rem .8rem;border-radius:10px;overflow-x:auto;
    background:rgba(0,0,0,.38);border:1px solid rgba(232,220,192,.12);
  }
  #doc pre code{background:0;border:0;padding:0;color:var(--ink-2)}
  #doc hr{border:0;border-top:1px solid rgba(232,220,192,.14);margin:1.3rem 0}
  #doc blockquote{
    margin:.7rem 0;padding:.3rem 0 .3rem .9rem;color:var(--muted);
    border-left:2px solid rgba(200,164,92,.45);
  }
  .status{font-size:.78rem;letter-spacing:.08em;color:var(--faint)}
  .status.fout{color:#e08080}
  footer{max-width:820px;margin:1.6rem auto 0;font-size:.72rem;color:var(--faint);text-align:center}
  footer a{color:var(--sand)}
  /* gereedschap onderaan: klein en gedempt */
  footer .foot-tools{margin-top:1rem;font-size:.7rem;letter-spacing:.03em;opacity:.7}
  footer .foot-tools a{color:inherit;text-decoration:underline;text-underline-offset:2px}
  footer .foot-tools a:hover{opacity:1;text-decoration-thickness:2px}

<main>
  <h1>Logboek</h1>
  <p class="sub">CHANGELOG.md · Wildpluk langs de kust</p>
  <p class="status" id="status" role="status">laden…</p>
  <article id="doc"></article>
</main>

<footer>© 2026 Eep · <a href="/">Eeps Site</a>  <p class="foot-tools">
    <a href="https://8080-agqx224k5zkc5mqncvy5shafsi.instabox.tech/static/piracy/html-editor.html">✏️ Tekst-editor</a> ·
    <a href="https://8080-agqx224k5zkc5mqncvy5shafsi.instabox.tech/n8n_front">⚡ n8n</a> ·
    <a href="https://8080-agqx224k5zkc5mqncvy5shafsi.instabox.tech/api_page">🔌 API</a>
  </p>
</footer>

<script>
(function () {
  'use strict';

  var doc = document.getElementById('doc');
  var status = document.getElementById('status');

  /* CHANGELOG.md staat naast deze pagina: op de VPS in /static/piracy/,
     op GitHub Pages in de root van de site. */
  var BRON = 'CHANGELOG.md';

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  /* alleen de opmaak die het changelog echt gebruikt */
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, function (_, code) { return '<code>' + code + '</code>'; })
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>')
      .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, tekst, url) {
        return '<a href="' + url + '" rel="noopener">' + tekst + '</a>';
      });
  }

  function render(md) {
    var regels = md.replace(/\r\n?/g, '\n').split('\n');
    var uit = [];
    var lijst = null;       // 'ul' | 'ol' | null
    var code = false;
    var codeRegels = [];
    var alinea = [];

    function sluitLijst() {
      if (lijst) { uit.push('</' + lijst + '>'); lijst = null; }
    }
    function sluitAlinea() {
      if (alinea.length) { uit.push('<p>' + inline(alinea.join(' ')) + '</p>'); alinea = []; }
    }

    regels.forEach(function (ruw) {
      var regel = ruw.replace(/\s+$/, '');

      if (code) {
        if (/^```/.test(regel)) {
          uit.push('<pre><code>' + esc(codeRegels.join('\n')) + '</code></pre>');
          codeRegels = [];
          code = false;
        } else {
          codeRegels.push(ruw);
        }
        return;
      }
      if (/^```/.test(regel)) {
        sluitLijst(); sluitAlinea(); code = true; return;
      }
      if (!regel.trim()) { sluitLijst(); sluitAlinea(); return; }

      var kop = regel.match(/^(#{1,4})\s+(.*)$/);
      if (kop) {
        sluitLijst(); sluitAlinea();
        var n = kop[1].length;
        uit.push('<h' + n + '>' + inline(kop[2]) + '</h' + n + '>');
        return;
      }
      if (/^(-{3,}|\*{3,})$/.test(regel.trim())) {
        sluitLijst(); sluitAlinea(); uit.push('<hr>'); return;
      }
      var punt = regel.match(/^\s*[-*+]\s+(.*)$/);
      var nummer = regel.match(/^\s*\d+[.)]\s+(.*)$/);
      if (punt || nummer) {
        sluitAlinea();
        var soort = punt ? 'ul' : 'ol';
        if (lijst !== soort) { sluitLijst(); uit.push('<' + soort + '>'); lijst = soort; }
        uit.push('<li>' + inline((punt || nummer)[1]) + '</li>');
        return;
      }
      if (/^>\s?/.test(regel)) {
        sluitLijst(); sluitAlinea();
        uit.push('<blockquote>' + inline(regel.replace(/^>\s?/, '')) + '</blockquote>');
        return;
      }
      sluitLijst();
      alinea.push(regel.trim());
    });

    sluitLijst(); sluitAlinea();
    if (code && codeRegels.length) {
      uit.push('<pre><code>' + esc(codeRegels.join('\n')) + '</code></pre>');
    }
    return uit.join('\n');
  }

  fetch(BRON, { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.text();
    })
    .then(function (md) {
      doc.innerHTML = render(md);
      status.textContent = 'bijgewerkt zojuist';
    })
    .catch(function (err) {
      status.textContent = 'kon het changelog niet laden: ' + err.message;
      status.className = 'status fout';
    });
})();
</script>
</body>
