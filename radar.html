<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar · Eeps Site</title>
<style>
  :root{
    --ink:#f4f1e8;--sand:#e8dcc0;--brass:#e6a23c;--brass-bright:#ffc861;
    --sea:#081018;--serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;color:var(--ink);font-family:var(--sans);background:var(--sea);
    display:flex;flex-direction:column;min-height:100vh;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(115% 85% at 50% 32%,rgba(4,10,16,.12) 0%,rgba(4,10,16,.42) 55%,rgba(4,10,16,.80) 100%),
      linear-gradient(to bottom,rgba(4,10,16,.42),rgba(4,10,16,.06) 40%,rgba(4,10,16,.76));
    z-index:0;pointer-events:none;
  }
  main{position:relative;z-index:1;flex:1;padding:min(7vh,52px) 20px 32px}
  .radar{
    position:relative;z-index:1;padding:2.2rem 20px 2.8rem;
    border-top:1px solid rgba(232,220,192,.14);
    background:linear-gradient(to bottom,rgba(4,10,16,.5),rgba(4,10,16,.92));
  }
  .radar-inner{max-width:880px;margin:0 auto}
  .radar .kicker{margin:0 0 .4rem}
  .radar-note{margin:.55rem 0 1.25rem;max-width:46rem;font-size:.8rem;line-height:1.65;color:#c9c3b4}
  .visits{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  .visit{
    display:grid;grid-template-columns:7.2rem minmax(0,1fr);gap:.2rem .9rem;
    padding:.72rem .95rem;border-radius:10px;background:rgba(10,18,26,.6);
    border:1px solid rgba(232,220,192,.14);font-size:.82rem;line-height:1.45;color:#e7e2d4;
  }
  .visit-time{color:var(--brass);font-size:.72rem;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap}
  .visit b{font-weight:700;color:var(--brass-bright);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
  .visit small{display:block;margin-top:.15rem;font-size:.72rem;color:#a9a291}
  .visit-note{grid-template-columns:1fr;color:#a9a291;font-size:.78rem}
  .visits-wrap{margin:.5rem 0 0;border:1px solid rgba(232,220,192,.16);border-radius:10px;background:rgba(4,10,16,.45);overflow:hidden}
  .visits-wrap summary{cursor:pointer;padding:.5rem .7rem;font-family:var(--sans);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--brass);list-style:none;display:flex;align-items:center;justify-content:space-between}
  .visits-wrap summary::-webkit-details-marker{display:none}
  .visits-wrap summary::after{content:"";width:8px;height:8px;border-right:2px solid var(--brass);border-bottom:2px solid var(--brass);transform:rotate(45deg);transition:transform .2s ease}
  .visits-wrap[open] summary::after{transform:rotate(-135deg)}
  .visits-wrap .visits{max-height:50vh;overflow-y:auto;margin:0;padding:.3rem .5rem .6rem;scrollbar-width:thin;scrollbar-color:rgba(255,200,97,.35) transparent}
  .visits-wrap .visits::-webkit-scrollbar{width:6px}
  .visits-wrap .visits::-webkit-scrollbar-thumb{background:rgba(255,200,97,.35);border-radius:3px}
  .radar-meta{margin:.9rem 0 0;font-size:.72rem;color:#8f8a7c;letter-spacing:.02em}
  .plugin{
    display:flex;flex-wrap:wrap;align-items:center;gap:.45rem .85rem;
    margin:1.3rem 0 1.4rem;padding:.8rem 1rem;border-radius:12px;
    background:rgba(10,18,26,.6);border:1px solid rgba(232,220,192,.16);
    font-size:.82rem;line-height:1.45;color:#e7e2d4;
  }
  .plugin-name{font-family:var(--serif);font-size:.95rem;color:#f4f1e8}
  .plugin-link{
    margin-left:auto;font-size:.74rem;letter-spacing:.03em;color:var(--brass-bright);
    text-decoration:none;border-bottom:1px solid rgba(255,200,97,.4);
  }
  .plugin-link:hover{border-bottom-color:var(--brass-bright)}
  .plugin-verify{display:inline-flex;align-items:center;gap:.5em;font-size:.72rem;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:#f4dcd8}
  .red-light{width:.58em;height:.58em;border-radius:50%;background:#e05a4f;box-shadow:0 0 0 3px rgba(224,90,79,.18);animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
  .state.wait{color:#f6e6bf}
  .state.wait::before{background:#e0b23f;box-shadow:0 0 0 3px rgba(224,178,63,.2)}
  .state.denied{color:#f4dcd8}
  .state.denied::before{background:#e05a4f;box-shadow:0 0 0 3px rgba(224,90,79,.18)}
  .state.on{color:#d9f2e2}
  .state.on::before{background:#38b06b;box-shadow:0 0 0 3px rgba(56,176,107,.2)}
  .back{margin:1.3rem 0 0;font-size:.82rem;text-align:center}
  .back a{color:var(--sand)}.back a:hover{color:var(--brass-bright)}
  footer{position:relative;z-index:1;padding:20px 20px 24px;text-align:center;border-top:1px solid rgba(232,220,192,.14);background:linear-gradient(to bottom,rgba(4,10,16,.55),rgba(4,10,16,.92))}
  footer p{margin:0 auto;max-width:44rem;font-size:.74rem;line-height:1.7;color:#a9a291}
  footer a{color:var(--sand)}
</style>
</head>
<body>
<main>
  <section class="radar">
    <div class="radar-inner">
      <p class="kicker">Radar</p>
      <div class="plugin" id="plugin-submission">
        <span class="plugin-name">mouse-in-the-corner</span>
        <span class="state wait">in afwachting van goedkeuring</span>
        <a class="plugin-link" href="https://plugins.omarchy.org/plugin.html?id=eep.window-controls">mouse-in-the-corner</a>
        <span class="plugin-verify">Update needs to be approved?! <span class="red-light"></span></span>
      </div>
      <p class="radar-note">Bezoekers</p>
      <details class="visits-wrap">
        <summary>Toon bezoeken</summary>
        <ul class="visits" id="visits">
          <li class="visit visit-note">Radar warmt op…</li>
        </ul>
      </details>
      <p class="radar-meta" id="visits-meta"></p>
    </div>
  </section>
  <p class="back"><a href="/">← Terug naar de landing</a></p>
</main>
<footer>
  <p>© 2026 Eep · radar van de Eeps Site</p>
</footer>
<script>
  (function(){
    var API = location.hostname === 'evtriest.github.io'
      ? 'https://8080-agqx224k5zkc5mqncvy5shafsi.instabox.tech'
      : '';
    var list = document.getElementById('visits');
    var meta = document.getElementById('visits-meta');
    var visitData = null;
    var firstVisit = null;

    function when(iso) {
      var d = new Date(iso);
      if (isNaN(d)) return iso || '?';
      try {
        return new Intl.DateTimeFormat('nl', {
          day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit'
        }).format(d);
      } catch (err) {
        return d.toISOString().slice(0, 16).replace('T', ' ');
      }
    }

    function renderVisits() {
      if (!list) return;
      if (!visitData) {
        list.innerHTML = '<li class="visit visit-note">Radar warmt op…</li>';
        return;
      }
      var items = visitData.items || [];
      if (!items.length) {
        list.innerHTML = '<li class="visit visit-note">Nog geen bezoeken op de radar.</li>';
        if (meta) meta.textContent = '';
        return;
      }
      list.innerHTML = items.map(function(v) {
        var seen = v.visits_from_ip > 1
          ? v.visits_from_ip + '× vanaf dit IP, eerst ' + when(v.first_seen_ip)
          : 'eerste bezoek';
        return '<li class="visit">' +
          '<span class="visit-time">' + when(v.time) + '</span>' +
          '<span><b>' + v.ip + '</b> · ' + v.browser + ' op ' + v.os + ' (' + v.device + ')' +
          '<small>' + v.page + ' · ' + (v.referrer ? 'via ' + v.referrer : 'direct') + ' · ' + (v.lang || '?') + ' · ' + seen + '</small></span></li>';
      }).join('');
      if (meta) {
        meta.textContent = items.length + ' bezoeken · bijgewerkt ' + when(visitData.fetched);
      }
    }

    fetch(API + '/api/bezoek?limit=8', { mode: 'cors' })
      .then(function(resp){ return resp.json(); })
      .then(function(data){
        visitData = data;
        firstVisit = data && data.tewaterlating ? data.tewaterlating : null;
        renderVisits();
      })
      .catch(function(){
        visitData = null;
        list.innerHTML = '<li class="visit visit-note">De radar is buiten bereik.</li>';
      });
  })();
</script>
</body>
</html>
