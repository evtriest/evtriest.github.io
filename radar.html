<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Radar · Eeps Site</title>
<style>
  :root{
    --bg:#0a0e12; --green:#00ff88; --amber:#ffaa00; --red:#ff3355;
    --glow-green:rgba(0,255,136,.35); --glow-amber:rgba(255,170,0,.4); --glow-red:rgba(255,51,85,.45);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{
    background:radial-gradient(ellipse at center,#0d1117 0%,#06080a 70%,#000 100%);
    color:var(--green);font-family:'Courier New',Courier,monospace;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    position:relative;
  }
  /* scanlines */
  body::before{
    content:"";position:fixed;inset:0;z-index:2;pointer-events:none;
    background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,0,0,.15) 2px,rgba(0,0,0,.15) 4px);
  }
  /* vignette */
  body::after{
    content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(circle at center,transparent 40%,rgba(0,0,0,.65) 100%);
  }
  .radar-container{
    position:relative;z-index:3;width:min(90vw,90vh,800px);height:min(90vw,90vh,800px);
    border-radius:50%;box-shadow:0 0 80px rgba(0,255,136,.12),inset 0 0 60px rgba(0,255,136,.06);
  }
  .radar{
    position:relative;width:100%;height:100%;border-radius:50%;overflow:hidden;
    background:radial-gradient(circle,rgba(0,20,10,.35) 0%,rgba(0,10,5,.55) 100%);
    border:2px solid rgba(0,255,136,.25);
  }
  /* grid */
  .ring{
    position:absolute;top:50%;left:50%;border-radius:50%;
    border:1px solid rgba(0,255,136,.12);transform:translate(-50%,-50%);
  }
  .ring.r1{width:25%;height:25%}
  .ring.r2{width:50%;height:50%}
  .ring.r3{width:75%;height:75%}
  .ring.r4{width:100%;height:100%}
  .radial{
    position:absolute;top:0;left:50%;width:1px;height:100%;
    background:linear-gradient(to bottom,transparent 0%,rgba(0,255,136,.1) 50%,transparent 100%);
    transform-origin:bottom center;
  }
  /* sweep */
  .sweep{
    position:absolute;top:50%;left:50%;width:50%;height:2px;
    background:linear-gradient(90deg,rgba(0,255,136,.8),transparent);
    transform-origin:left center;animation:sweep 4s linear infinite;
    box-shadow:0 0 12px var(--glow-green);
  }
  @keyframes sweep{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  /* blips */
  .blip{
    position:absolute;width:8px;height:8px;border-radius:50%;
    transform:translate(-50%,-50%);cursor:pointer;opacity:0;
    box-shadow:0 0 8px currentColor;transition:opacity .3s;
  }
  .blip.ok{background:var(--green);color:var(--green)}
  .blip.warning{background:var(--amber);color:var(--amber)}
  .blip.critical{background:var(--red);color:var(--red);animation:blip-pulse 1s infinite}
  .blip.visible{opacity:1}
  @keyframes blip-pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.4)}}
  /* detail panel */
  .panel{
    position:fixed;right:-420px;top:0;width:min(400px,90vw);height:100vh;
    background:rgba(8,12,16,.96);border-left:1px solid rgba(0,255,136,.25);
    box-shadow:-8px 0 30px rgba(0,0,0,.7);z-index:10;padding:1.5rem;
    transition:right .3s ease;overflow-y:auto;
  }
  .panel.open{right:0}
  .panel h2{color:var(--green);font-size:1.1rem;margin-bottom:.8rem;letter-spacing:.05em}
  .panel .status{
    display:inline-block;padding:.3em .8em;border-radius:4px;font-size:.75rem;
    letter-spacing:.1em;text-transform:uppercase;margin-bottom:1rem;
  }
  .panel .status.ok{background:rgba(0,255,136,.15);color:var(--green);border:1px solid rgba(0,255,136,.3)}
  .panel .status.warning{background:rgba(255,170,0,.15);color:var(--amber);border:1px solid rgba(255,170,0,.3)}
  .panel .status.critical{background:rgba(255,51,85,.15);color:var(--red);border:1px solid rgba(255,51,85,.3)}
  .panel .metric{display:flex;justify-content:space-between;padding:.5rem 0;border-bottom:1px solid rgba(0,255,136,.1);font-size:.85rem}
  .panel .metric b{color:var(--green)}
  .panel .metric span{color:#a0b8a8}
  .panel .close{
    position:absolute;top:1rem;right:1rem;background:0;border:1px solid rgba(0,255,136,.3);
    color:var(--green);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1rem;
  }
  .panel .close:hover{background:rgba(0,255,136,.1)}
  /* timestamp */
  .timestamp{
    position:fixed;bottom:1.5rem;right:1.5rem;z-index:5;
    font-size:.7rem;letter-spacing:.15em;color:var(--green);opacity:.7;
    text-shadow:0 0 6px var(--glow-green);
  }
  .back{
    position:fixed;top:1.5rem;left:1.5rem;z-index:5;
    color:var(--green);text-decoration:none;font-size:.8rem;letter-spacing:.1em;
    opacity:.7;
  }
  .back:hover{opacity:1}
</style>
</head>
<body>
<a class="back" href="/">← Landing</a>
<div class="radar-container">
  <div class="radar" id="radar">
    <div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="ring r4"></div>
    <div class="radial" style="transform:rotate(0deg)"></div>
    <div class="radial" style="transform:rotate(45deg)"></div>
    <div class="radial" style="transform:rotate(90deg)"></div>
    <div class="radial" style="transform:rotate(135deg)"></div>
    <div class="sweep"></div>
  </div>
</div>
<div class="timestamp" id="timestamp">LAST SCAN: --</div>
<div class="panel" id="panel">
  <button class="close" onclick="closePanel()">✕</button>
  <h2 id="panel-name">--</h2>
  <div class="status" id="panel-status">--</div>
  <div id="panel-metrics"></div>
</div>

<script>
const MOCK_DATA = [
  { id: 1,  name: "CPU Usage",          status: "ok",       value: 23,    unit: "%",    details: { cores: 4, load_avg: [0.42, 0.38, 0.35], top_process: "node (12%)" } },
  { id: 2,  name: "Memory Usage",       status: "ok",       value: 41,    unit: "%",    details: { total_gb: 8, used_gb: 3.3, free_gb: 4.7, buff_cache_gb: 1.2 } },
  { id: 3,  name: "Disk Usage",         status: "warning",  value: 82,    unit: "%",    details: { total_gb: 100, used_gb: 82, inode_pct: 34, filesystem: "ext4" } },
  { id: 4,  name: "Disk I/O",           status: "ok",       value: 12,    unit: "MB/s", details: { read_mbps: 8, write_mbps: 4, iops: 145, device: "sda" } },
  { id: 5,  name: "Network In",         status: "ok",       value: 4.2,   unit: "Mbps", details: { peak_mbps: 11.3, packets_s: 2340, errors: 0 } },
  { id: 6,  name: "Network Out",        status: "ok",       value: 7.8,   unit: "Mbps", details: { peak_mbps: 15.1, packets_s: 3120, errors: 0 } },
  { id: 7,  name: "Uptime",             status: "ok",       value: 142,   unit: "days", details: { since: "2026-06-11 04:32 UTC", reboots: 0 } },
  { id: 8,  name: "CPU Temperature",    status: "ok",       value: 47,    unit: "°C",   details: { max_c: 52, threshold_c: 85, sensor: "coretemp" } },
  { id: 9,  name: "Swap Usage",         status: "ok",       value: 3,     unit: "%",    details: { total_mb: 4096, used_mb: 124, free_mb: 3972 } },
  { id: 10, name: "Load Average",       status: "ok",       value: 0.42,  unit: "1m",   details: { load_5m: 0.38, load_15m: 0.35, cores: 4, ratio: 0.10 } },
  { id: 11, name: "Open Connections",   status: "ok",       value: 87,    unit: "",     details: { tcp: 72, udp: 15, max_allowed: 1024 } },
  { id: 12, name: "DNS Response",       status: "ok",       value: 12,    unit: "ms",   details: { provider: "Cloudflare", avg_ms: 12, p99_ms: 34 } },
  { id: 13, name: "SSL Certificate",    status: "warning",  value: 14,    unit: "days", details: { domain: "vps.example.nl", issuer: "Let's Encrypt", expires: "2026-11-14" } },
  { id: 14, name: "Bandwidth Used",     status: "ok",       value: 34,    unit: "%",    details: { used_gb: 340, quota_gb: 1000, month: "Oct 2026" } },
  { id: 15, name: "Process Count",      status: "ok",       value: 148,   unit: "",     details: { running: 12, sleeping: 136, zombies: 0, max: 4096 } },
  { id: 16, name: "File Descriptors",   status: "ok",       value: 28,    unit: "%",    details: { used: 285, max: 1024 } },
  { id: 17, name: "DB Connection Pool", status: "critical", value: 95,    unit: "%",    details: { active: 38, max: 40, waiting: 7, avg_wait_ms: 340 } },
  { id: 18, name: "Queue Depth",        status: "ok",       value: 3,     unit: "jobs", details: { pending: 3, processing: 1, failed: 0, worker: "bull" } },
  { id: 19, name: "HTTP Error Rate",    status: "ok",       value: 0.2,   unit: "%",    details: { total_req: 12840, errors_5xx: 26, errors_4xx: 142, window: "1h" } },
  { id: 20, name: "Backup Status",      status: "ok",       value: 6,     unit: "h ago", details: { last_run: "2026-10-31 04:00 UTC", size_gb: 2.1, status: "success" } }
];

const radar = document.getElementById('radar');
const panel = document.getElementById('panel');
const blips = [];
let scanTime = null;

function polarToCart(angleDeg, radiusPct){
  const rad = (angleDeg - 90) * Math.PI / 180;
  const r = radiusPct / 100;
  return { x: 50 + 50 * r * Math.cos(rad), y: 50 + 50 * r * Math.sin(rad) };
}

function createBlip(item, delay){
  const pos = polarToCart(Math.random() * 360, 15 + Math.random() * 75);
  const el = document.createElement('div');
  el.className = 'blip ' + item.status;
  el.style.left = pos.x + '%';
  el.style.top = pos.y + '%';
  el.title = item.name;
  el.dataset.id = item.id;
  el.addEventListener('click', () => openPanel(item));
  radar.appendChild(el);
  blips.push({ el, delay, shown: false });
}

function scheduleBlips(){
  blips.forEach(b => {
    setTimeout(() => {
      b.el.classList.add('visible');
      b.shown = true;
    }, b.delay);
  });
}

function openPanel(item){
  document.getElementById('panel-name').textContent = item.name;
  const statusEl = document.getElementById('panel-status');
  statusEl.className = 'status ' + item.status;
  statusEl.textContent = item.status;
  const metrics = document.getElementById('panel-metrics');
  metrics.innerHTML = '';
  const main = document.createElement('div'); main.className='metric';
  main.innerHTML = `<b>Value</b><span>${item.value} ${item.unit}</span>`;
  metrics.appendChild(main);
  Object.entries(item.details).forEach(([k,v]) => {
    const row = document.createElement('div'); row.className='metric';
    const val = Array.isArray(v) ? v.join(', ') : v;
    row.innerHTML = `<b>${k}</b><span>${val}</span>`;
    metrics.appendChild(row);
  });
  panel.classList.add('open');
}
function closePanel(){ panel.classList.remove('open'); }
document.addEventListener('click', e => {
  if (!panel.contains(e.target) && !e.target.closest('.blip')) closePanel();
});

function init(){
  // timestamp on load
  const now = new Date();
  scanTime = now.toISOString().replace('T',' ').slice(0,19) + ' UTC';
  document.getElementById('timestamp').textContent = 'LAST SCAN: ' + scanTime;

  // place blips with staggered delays based on sweep angle (0-4s)
  MOCK_DATA.forEach((item, i) => {
    const delay = (i / MOCK_DATA.length) * 4000 + Math.random() * 600;
    createBlip(item, delay);
  });
  scheduleBlips();
}

window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
